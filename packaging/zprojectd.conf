# zprojectd configuration (SPEC.md §4.4, §9.1). Values in <angle brackets>
# are placeholders and are ignored until replaced.

[server]
# Loopback only; `tailscale serve` publishes it on the tailnet.
listen=127.0.0.1:8788
database=/var/lib/zproject/zproject.db
# Extra Host header values to accept (comma-separated), e.g. the server's
# MagicDNS name as `tailscale serve` forwards it. Loopback names are always
# accepted.
allowed_hosts=<server-host>.<tailnet>.ts.net

[backup]
dir=/var/lib/zproject/backups

[alerts]
# ts-notify-hub base URL. The bearer token is read from token_file
# (root:zproject, mode 0640); never put it in this file.
notify_hub_url=<notify-hub-url>
topic=zproject
token_file=/etc/zproject/notify-hub.token
