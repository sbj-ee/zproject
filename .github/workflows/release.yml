# Publish a release when a v* tag is pushed (`git push origin vX.Y.Z`, only
# after merge and with Stephen's yes; SPEC.md §20, docs/RELEASING.md):
# build and test on Ubuntu 24.04 and macOS 15, package
#   zproject_<v>_amd64.deb    desktop app + zproject-cli (Linux amd64)
#   zprojectd_<v>_amd64.deb   server (Pop!_OS / Ubuntu 24.04)
#   zproject-<v>-Darwin.dmg   zproject.app with zproject-cli (macOS arm64)
# write SHA256SUMS, sign it with minisign (SHA256SUMS.minisig) in the
# protected "release" environment (approved by sbj-ee), check the signature
# against the public key in core/UpdateSigningKey.cpp at the tagged commit,
# and create the GitHub Release. Same shape as zterminal and ztodo.
name: Release

on:
  push:
    tags: ['v*']

# Least privilege: jobs get read-only contents unless they say otherwise.
# Only publish writes (gh release create); the build jobs may mint an OIDC
# token solely to sign build-provenance attestations for their packages.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Build Linux ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write     # Sigstore signing for the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the v* tags, for README "Current release"

      # Before building: the tag must be v$VERSION and the top CHANGELOG
      # heading dated; CMake, CHANGELOG, README and SPEC agree.
      - name: Check version and changelog for this tag
        run: scripts/check-version.sh --tag "${GITHUB_REF_NAME}"

      - name: Install Qt 6 (noble, 6.4) + build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-base-dev qt6-qpa-plugins libgl1-mesa-dev cmake ninja-build g++ dpkg-dev file \
            libsodium-dev pkg-config

      - name: Restore SQLite download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/zproject
          key: sqlite-${{ runner.os }}-${{ hashFiles('cmake/FetchSQLite.cmake') }}

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DZPROJECT_WERROR=ON

      - name: Tag must match project() VERSION
        run: |
          version=$(sed -n 's/.*CMAKE_PROJECT_VERSION:STATIC=//p' build/CMakeCache.txt)
          echo "tag=$GITHUB_REF_NAME project=$version"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project(zproject VERSION $version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package .debs
        run: |
          set -euo pipefail
          cd build
          cpack -G DEB
          for deb in "zproject_${VERSION}_amd64.deb" "zprojectd_${VERSION}_amd64.deb"; do
            test -f "$deb"
            dpkg-deb -I "$deb"
          done
          dpkg-deb -c "zproject_${VERSION}_amd64.deb" > desktop.list
          dpkg-deb -c "zprojectd_${VERSION}_amd64.deb" > server.list
          grep -q './usr/bin/zproject-cli$' desktop.list
          grep -q './usr/bin/zprojectd$' server.list
          grep -q './usr/lib/systemd/system/zprojectd.service$' server.list
          sha256sum "zproject_${VERSION}_amd64.deb" "zprojectd_${VERSION}_amd64.deb" > SHA256SUMS.linux
          cat SHA256SUMS.linux

      # Signed SLSA build provenance (verify with
      # `gh attestation verify <file> -R sbj-ee/zproject`).
      - name: Attest build provenance (.debs)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/zproject*_amd64.deb

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zproject-release-linux
          path: |
            build/zproject_*_amd64.deb
            build/zprojectd_*_amd64.deb
            build/SHA256SUMS.linux
          if-no-files-found: error

  macos:
    name: Build macOS ${{ github.ref_name }}
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check version and changelog for this tag
        run: scripts/check-version.sh --tag "${GITHUB_REF_NAME}"

      - name: Install Qt + build tools (brew)
        run: brew install qt cmake ninja libsodium pkg-config

      - name: Restore SQLite download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/zproject
          key: sqlite-${{ runner.os }}-${{ hashFiles('cmake/FetchSQLite.cmake') }}

      - name: Configure arm64
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DZPROJECT_WERROR=ON \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0

      - name: Tag must match project() VERSION
        run: |
          version=$(sed -n 's/.*CMAKE_PROJECT_VERSION:STATIC=//p' build/CMakeCache.txt)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project(zproject VERSION $version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package .dmg
        run: |
          set -euo pipefail
          cd build
          cpack -G DragNDrop
          dmg="zproject-${VERSION}-Darwin.dmg"
          test -f "$dmg"
          shasum -a 256 "$dmg" > SHA256SUMS.macos
          cat SHA256SUMS.macos

      - name: Verify .dmg
        run: |
          set -euo pipefail
          dmg="build/zproject-${VERSION}-Darwin.dmg"
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          tools/macos/check-bundle.sh "$mnt/zproject.app"
          codesign --verify --deep --strict --verbose=2 "$mnt/zproject.app"
          "$mnt/zproject.app/Contents/MacOS/zproject" --version
          "$mnt/zproject.app/Contents/MacOS/zproject-cli" --version
          "$mnt/zproject.app/Contents/MacOS/zproject-cli" doctor
          tools/macos/check-cli-tls.sh "$mnt/zproject.app"

      - name: Attest build provenance (.dmg)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/zproject-*-Darwin.dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zproject-release-macos
          path: |
            build/zproject-*-Darwin.dmg
            build/SHA256SUMS.macos
          if-no-files-found: error

  publish:
    name: Publish ${{ github.ref_name }}
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    # The signing secrets live in the protected "release" environment: this
    # job waits for sbj-ee's approval, and only v* tags may deploy to it.
    environment: release
    permissions:
      contents: write # gh release create
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist

      - name: Assemble and sign SHA256SUMS, create release
        env:
          GH_TOKEN: ${{ github.token }}
          # minisign secret key (the whole .key file) and its password; see
          # docs/RELEASING.md. Without them nothing is published.
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp "dist/zproject-release-linux/zproject_${version}_amd64.deb" out/
          cp "dist/zproject-release-linux/zprojectd_${version}_amd64.deb" out/
          cp "dist/zproject-release-macos/zproject-${version}-Darwin.dmg" out/
          {
            cat dist/zproject-release-linux/SHA256SUMS.linux
            cat dist/zproject-release-macos/SHA256SUMS.macos
          } > out/SHA256SUMS
          cat out/SHA256SUMS
          (cd out && sha256sum -c SHA256SUMS)

          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::Secret MINISIGN_SECRET_KEY is not set in the release environment: refusing to publish an unsigned release (docs/RELEASING.md)"
            exit 1
          fi
          sudo apt-get install -y -qq minisign
          key="$RUNNER_TEMP/minisign.key"
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "${MINISIGN_PASSWORD:-}" \
            | minisign -S -s "$key" -m out/SHA256SUMS -t "zproject $GITHUB_REF_NAME SHA256SUMS"
          rm -f "$key"
          # Check it against the public key at the tagged commit, so a release
          # nobody can verify never goes out.
          pub=$(gh api "repos/$GITHUB_REPOSITORY/contents/core/UpdateSigningKey.cpp?ref=$GITHUB_SHA" \
                  -H "Accept: application/vnd.github.raw" \
                | sed -n 's/.*kUpdateSigningPublicKey\[\] = "\(RW[A-Za-z0-9+/=]*\)".*/\1/p')
          if [ -z "$pub" ]; then
            echo "::error::no public key in core/UpdateSigningKey.cpp"
            exit 1
          fi
          minisign -V -P "$pub" -m out/SHA256SUMS -x out/SHA256SUMS.minisig

          gh release create "$GITHUB_REF_NAME" \
            "out/zproject_${version}_amd64.deb" \
            "out/zprojectd_${version}_amd64.deb" \
            "out/zproject-${version}-Darwin.dmg" \
            out/SHA256SUMS \
            out/SHA256SUMS.minisig \
            --repo "$GITHUB_REPOSITORY" \
            --title "zproject $version" \
            --generate-notes \
            --verify-tag
