# Build, test and package zproject on Ubuntu 24.04 (Linux amd64, distro Qt 6.4,
# the same base as the server host's Pop!_OS 24.04) and macOS 15 (Apple Silicon,
# Homebrew Qt). The version comes from CMake project() -> PROJECT_VERSION;
# artifacts are zproject_<version>_amd64.deb and zprojectd_<version>_amd64.deb.
# SPEC.md §19 lists the full job set; fuzzing and the .dmg are added with the
# code they test. The OpenAPI document is linted in its own job, and the
# systemd units are checked with systemd-analyze in the install smoke test.
#
# SQLite is downloaded at configure time and verified against the hashes
# pinned in cmake/FetchSQLite.cmake; every building job restores the download
# cache (~/.cache/zproject) with actions/cache, keyed on that file.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the v* tags, for README "Current release"
      # CMakeLists.txt version, top CHANGELOG heading, README header and the
      # SPEC.md version line agree.
      - name: Check version drift
        run: scripts/check-version.sh

  # Every PR bumps the version (SPEC.md §22): its CMakeLists.txt version must
  # be greater than the base branch's. Pull requests only; Dependabot's PRs
  # are exempt.
  version-increase:
    name: Version increase
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Version is greater than the base branch's
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          scripts/check-version-increase.sh "origin/${BASE_REF}"

  linux:
    name: Linux (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt 6 (noble, 6.4) + build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-base-dev qt6-qpa-plugins libgl1-mesa-dev cmake ninja-build g++ dpkg-dev file
          dpkg-query -W -f='qt6-base-dev ${Version}\n' qt6-base-dev

      - name: Restore SQLite download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/zproject
          key: sqlite-${{ runner.os }}-${{ hashFiles('cmake/FetchSQLite.cmake') }}

      # ZPROJECT_WERROR: a new compiler warning fails CI (off for local builds).
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DZPROJECT_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The pin must hold: a configure whose cached SQLite zip has the wrong
      # hash fails (ctest sqlite_hash_verification covers the other cases).
      - name: Wrong SQLite hash fails the configure
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bad-cache"
          cp ~/.cache/zproject/sqlite-amalgamation-*.zip "$RUNNER_TEMP/bad-cache/"
          printf 'x' >> "$RUNNER_TEMP"/bad-cache/sqlite-amalgamation-*.zip
          if cmake -B build-bad -G Ninja -DZPROJECT_SQLITE_CACHE="$RUNNER_TEMP/bad-cache" \
               -DZPROJECT_SQLITE_OFFLINE=ON > bad-configure.log 2>&1; then
            cat bad-configure.log
            echo "::error::configure accepted a SQLite zip with the wrong hash"; exit 1
          fi
          grep -A3 'SQLite SHA3-256 mismatch' bad-configure.log
          rm -rf build-bad bad-configure.log "$RUNNER_TEMP/bad-cache"

      - name: Package .debs
        run: |
          set -euo pipefail
          cd build
          cpack -G DEB
          ls -l *.deb
          for d in zproject_*_amd64.deb zprojectd_*_amd64.deb; do
            dpkg-deb -I "$d"
            dpkg-deb -c "$d"
          done
          # Listings go to files first: `grep -q` closing a pipe early would
          # make dpkg-deb fail with SIGPIPE under pipefail.
          dpkg-deb -c zproject_*_amd64.deb > desktop.list
          dpkg-deb -c zprojectd_*_amd64.deb > server.list
          dpkg-deb -f zprojectd_*_amd64.deb Depends > server.depends
          grep -q './usr/bin/zproject$' desktop.list
          grep -q './usr/bin/zproject-cli$' desktop.list
          grep -q './usr/share/applications/zproject.desktop$' desktop.list
          grep -q './usr/share/icons/hicolor/256x256/apps/zproject.png$' desktop.list
          grep -q './usr/bin/zprojectd$' server.list
          grep -q './usr/lib/systemd/system/zprojectd.service$' server.list
          grep -q './usr/lib/systemd/system/zprojectd-backup.service$' server.list
          grep -q './usr/lib/systemd/system/zprojectd-backup.timer$' server.list
          grep -q './etc/zproject/zprojectd.conf$' server.list
          dpkg-deb -e zprojectd_*_amd64.deb server.control
          grep -qx '/etc/zproject/zprojectd.conf' server.control/conffiles
          test -x server.control/postinst
          rm -rf server.control
          # The server package is headless: Qt Core + Network, never Widgets/Gui.
          grep -q 'libqt6network6' server.depends
          # (`! grep` would not fail the step under set -e, so test explicitly.)
          if grep -Eq 'libqt6(widgets|gui)6' server.depends; then echo "::error::zprojectd depends on Qt GUI"; exit 1; fi
          if grep -Eq 'zproject-cli$|/zproject$' server.list; then echo "::error::client binaries in zprojectd"; exit 1; fi

      # Install both packages on a clean Ubuntu 24.04 (the server host's base),
      # check the systemd units, then run zprojectd as the zproject user
      # created by postinst and call the API with a throwaway owner token
      # (never printed).
      - name: Install smoke test (ubuntu:24.04 container)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/build:/pkgs:ro" ubuntu:24.04 bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq systemd curl >/dev/null
            apt-get install -y -qq /pkgs/zprojectd_*_amd64.deb >/dev/null
            zprojectd --version
            zprojectd --db /tmp/smoke.db --migrate-only
            zprojectd --db /tmp/smoke.db --migrate-only
            if zprojectd --listen 0.0.0.0:8788; then echo "non-loopback bind accepted" >&2; exit 1; fi

            # postinst: the zproject user and a private state directory.
            id zproject
            test "$(stat -c "%U %a" /var/lib/zproject)" = "zproject 700"
            test "$(stat -c "%U:%G %a" /etc/zproject/zprojectd.conf)" = "root:zproject 640"
            units="/usr/lib/systemd/system/zprojectd.service /usr/lib/systemd/system/zprojectd-backup.service /usr/lib/systemd/system/zprojectd-backup.timer"
            systemd-analyze verify $units
            grep -qx "MemoryMax=512M" /usr/lib/systemd/system/zprojectd.service
            grep -qx "OnCalendar=\*-\*-\* 03:17:00" /usr/lib/systemd/system/zprojectd-backup.timer

            conf=/etc/zproject/zprojectd.conf
            # setpriv execs directly (runuser would sit in between and relay
            # the SIGTERM below to the whole process group).
            as_zproject="setpriv --reuid=zproject --regid=zproject --init-groups"
            token=$($as_zproject zprojectd --config "$conf" --create-owner-token --name ci-smoke 2>/dev/null)
            $as_zproject zprojectd --config "$conf" 2>/tmp/zprojectd.log &
            pid=$!
            for _ in $(seq 50); do curl -fsS -o /dev/null http://127.0.0.1:8788/v1/health && break; sleep 0.1; done
            curl -fsS http://127.0.0.1:8788/v1/health
            echo
            test "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8788/v1/projects)" = 401
            test "$(curl -s -o /dev/null -w "%{http_code}" -H "Host: evil.example" http://127.0.0.1:8788/v1/health)" = 400
            auth="Authorization: Bearer $token"
            curl -fsS -o /dev/null -H "$auth" -H "Content-Type: application/json" -d "{\"name\":\"Smoke\"}" http://127.0.0.1:8788/v1/projects
            projects=$(curl -fsS -H "$auth" http://127.0.0.1:8788/v1/projects)
            case "$projects" in *"\"name\":\"Smoke\""*) ;; *) echo "project not listed" >&2; exit 1;; esac
            curl -fsS -o /dev/null -H "$auth" -H "Content-Type: application/json" \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/list\"}" http://127.0.0.1:8788/mcp
            kill -TERM "$pid"
            wait "$pid"
            cat /tmp/zprojectd.log
            if grep -q "zpt_" /tmp/zprojectd.log; then echo "token in the log" >&2; exit 1; fi
            $as_zproject zprojectd --config "$conf" --verify-audit
            $as_zproject zprojectd --config "$conf" --backup
            ls -l /var/lib/zproject/backups

            apt-get install -y -qq /pkgs/zproject_*_amd64.deb >/dev/null
            zproject-cli --version
            zproject --version
          '

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zproject-debs
          path: build/*.deb
          if-no-files-found: error

  # api/openapi.yaml is valid OpenAPI 3.1 (Redocly's recommended rules) and
  # api/openapi.json, which zprojectd embeds, is generated from it.
  openapi:
    name: OpenAPI lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PyYAML
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-yaml
      - name: openapi.json matches openapi.yaml
        run: scripts/openapi-json.py --check
      - name: Redocly lint
        run: npx -y @redocly/cli@2.77.0 lint --format=github-actions api/openapi.yaml

  linux-server-only:
    name: Linux server-only build (no Qt Widgets)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Qt 6 Core/Network only + build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev cmake ninja-build g++
      - name: Restore SQLite download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/zproject
          key: sqlite-${{ runner.os }}-${{ hashFiles('cmake/FetchSQLite.cmake') }}

      - name: Configure (ZPROJECT_BUILD_GUI=OFF)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DZPROJECT_WERROR=ON -DZPROJECT_BUILD_GUI=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
          test ! -e build/app/zproject

  macos:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt + build tools (brew)
        run: brew install qt cmake ninja

      - name: Restore SQLite download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/zproject
          key: sqlite-${{ runner.os }}-${{ hashFiles('cmake/FetchSQLite.cmake') }}

      - name: Configure arm64
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DZPROJECT_WERROR=ON \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0

      - name: Build
        run: cmake --build build

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
          file build/server/zprojectd | grep -q arm64

  sanitizers:
    name: Sanitizers (ASan + UBSan, ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt 6 + build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev qt6-qpa-plugins libgl1-mesa-dev cmake ninja-build g++

      - name: Restore SQLite download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/zproject
          key: sqlite-${{ runner.os }}-${{ hashFiles('cmake/FetchSQLite.cmake') }}

      - name: Configure (RelWithDebInfo, -fsanitize=address,undefined)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DZPROJECT_SANITIZE=address,undefined

      - name: Build
        run: cmake --build build

      - name: Test under ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  clang-tidy:
    name: clang-tidy (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt 6 + clang-tidy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev libgl1-mesa-dev cmake ninja-build clang clang-tidy
          clang-tidy --version

      - name: Restore SQLite download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/zproject
          key: sqlite-${{ runner.os }}-${{ hashFiles('cmake/FetchSQLite.cmake') }}

      - name: Configure (clang, compile_commands.json)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DZPROJECT_BUILD_TESTS=OFF

      # The analysis needs the generated headers (moc output, version.hpp).
      - name: Build
        run: cmake --build build

      # Checks are in .clang-tidy; any finding fails the job.
      - name: Run clang-tidy
        run: run-clang-tidy -quiet -p build "$PWD/(core|store|server|app|cli)/.*\.cpp$"
