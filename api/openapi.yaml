# zproject HTTP API, the source of truth for /v1 (SPEC.md §9). api/openapi.json
# is generated from this file (scripts/openapi-json.py) and embedded in
# zprojectd, which serves it at GET /v1/openapi.json. CI lints this file and
# checks that the JSON is up to date; tests/tst_api.cpp checks that every
# operation here matches the server's route table (operationId, scope,
# destructive, dry run) and the other way round.
openapi: 3.1.0
info:
  title: zproject API
  version: 0.22.0
  description: |
    Plans served by zprojectd on 127.0.0.1:8788, published on the tailnet by
    `tailscale serve`. Every request except `GET /v1/health` needs
    `Authorization: Bearer zpt_<id>.<secret>`. Each operation names the
    scope it needs (`x-zproject-scope`; `any` = any valid token), whether
    it is destructive (`x-zproject-destructive`; tokens with
    `requireConfirm` must confirm it) and whether it takes `?dryRun=true`
    (`x-zproject-dry-run`).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://server-host.example.ts.net
    description: zprojectd behind tailscale serve (tailnet only)
security:
  - bearer: []
tags:
  - name: meta
    description: Health and this description
  - name: projects
    description: Projects
  - name: tasks
    description: Tasks and the WBS tree
  - name: dependencies
    description: Links between tasks (FS, SS, FF with lag)
  - name: calendars
    description: Working calendars, holidays and other exceptions
  - name: schedule
    description: The critical-path schedule (dates, float, critical path, violations)
  - name: sync
    description: The change feed for client caches
  - name: admin
    description: Tokens, audit log and backups
paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [meta]
      summary: Server health and versions (no token needed)
      security: []
      x-zproject-scope: none
      x-zproject-destructive: false
      x-zproject-dry-run: false
      responses:
        '200':
          description: The server is up
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '400':
          description: "400 bad_host: the Host header is not one of the configured names"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/openapi.json:
    get:
      operationId: getOpenApi
      tags: [meta]
      summary: This API description as JSON
      x-zproject-scope: any
      x-zproject-destructive: false
      x-zproject-dry-run: false
      responses:
        '200':
          description: The OpenAPI 3.1 document
          content:
            application/json:
              schema: {type: object}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /v1/projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: Projects this token may see
      x-zproject-scope: projects:read
      x-zproject-destructive: false
      x-zproject-dry-run: false
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/includeDeleted'
      responses:
        '200':
          description: A page of projects
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectPage'}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project (tokens limited to named projects cannot)
      x-zproject-scope: projects:write
      x-zproject-destructive: false
      x-zproject-dry-run: true
      parameters:
        - $ref: '#/components/parameters/dryRun'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectInput'}
      responses:
        '200': {$ref: '#/components/responses/DryRun'}
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/projects/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      operationId: getProject
      tags: [projects]
      summary: One project
      x-zproject-scope: projects:read
      x-zproject-destructive: false
      x-zproject-dry-run: false
      responses:
        '200':
          description: The project
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Change project fields (If-Match honoured)
      x-zproject-scope: projects:write
      x-zproject-destructive: false
      x-zproject-dry-run: true
      parameters:
        - $ref: '#/components/parameters/dryRun'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectInput'}
      responses:
        '200':
          description: The updated project, or a dry-run result with ?dryRun=true
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Project'
                  - $ref: '#/components/schemas/DryRunResult'
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/RevMismatch'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Tombstone a project and its tasks (destructive)
      x-zproject-scope: projects:write
      x-zproject-destructive: true
      x-zproject-dry-run: true
      parameters:
        - $ref: '#/components/parameters/dryRun'
        - $ref: '#/components/parameters/ifMatch'
        - $ref: '#/components/parameters/confirm'
      responses:
        '200':
          description: The tombstoned project, or a dry-run result with a confirmId
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Project'
                  - $ref: '#/components/schemas/DryRunResult'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/RevMismatch'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/projects/{id}/wbs:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      operationId: getWbs
      tags: [tasks]
      summary: The task tree with WBS codes (1, 1.1, 1.2, 2, ...)
      x-zproject-scope: tasks:read
      x-zproject-destructive: false
      x-zproject-dry-run: false
      responses:
        '200':
          description: WBS rows in depth-first order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Wbs'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/projects/{id}/tasks:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      operationId: listTasks
      tags: [tasks]
      summary: A project's tasks in WBS order, optionally filtered
      x-zproject-scope: tasks:read
      x-zproject-destructive: false
      x-zproject-dry-run: false
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/includeDeleted'
        - name: q
          in: query
          description: Text to find in the title or notes (case-insensitive)
          schema: {type: string}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/TaskStatus'}
      responses:
        '200':
          description: A page of tasks
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskPage'}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      operationId: createTask
      tags: [tasks]
      summary: Add a task to the project
      x-zproject-scope: tasks:write
      x-zproject-destructive: false
      x-zproject-dry-run: true
      parameters:
        - $ref: '#/components/parameters/dryRun'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskInput'}
      responses:
        '200': {$ref: '#/components/responses/DryRun'}
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      operationId: getTask
      tags: [tasks]
      summary: One task
      x-zproject-scope: tasks:read
      x-zproject-destructive: false
      x-zproject-dry-run: false
      responses:
        '200':
          description: The task
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Change task fields (If-Match honoured)
      description: >-
        A summary task (one with live children) derives percentComplete,
        status, actualStart and actualFinish from its children (SPEC.md §5.3);
        changing any of them on a summary is a 400 validation error. A write
        to a child also updates its summaries, each with its own revision and
        change record; a dry run lists those updates too.
      x-zproject-scope: tasks:write
      x-zproject-destructive: false
      x-zproject-dry-run: true
      parameters:
        - $ref: '#/components/parameters/dryRun'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskInput'}
      responses:
        '200':
          description: The updated task, or a dry-run result with ?dryRun=true
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Task'
                  - $ref: '#/components/schemas/DryRunResult'
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/RevMismatch'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Tombstone a task and its subtree, with their links (destructive)
      x-zproject-scope: tasks:write
      x-zproject-destructive: true
      x-zproject-dry-run: true
      parameters:
        - $ref: '#/components/parameters/dryRun'
        - $ref: '#/components/parameters/ifMatch'
        - $ref: '#/components/parameters/confirm'
      responses:
        '200':
          description: The tombstoned task, or a dry-run result with a confirmId
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Task'
                  - $ref: '#/components/schemas/DryRunResult'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/RevMismatch'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/tasks/{id}/move:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      operationId: moveTask
      tags: [tasks]
      summary: Move a task to a new parent and/or position within its project (If-Match honoured)
      description: >-
        Reparents and/or reorders a task and its subtree within the same
        project (SPEC.md §7.1). `position` is the 0-based index among the
        destination's live children, not counting the task itself; omitted,
        the task goes last. The destination's children are renumbered 1..n
        (`order`), each sibling whose order changes getting its own revision
        and change record, and the old and new parents' summaries are rolled
        up again (SPEC.md §5.3). Moving a task under itself or one of its
        descendants is a 409 cycle, as is a move that would loop through
        links (a task linked to the summary it moves under); a milestone, deleted or missing parent, a
        parent in another project or a position out of range is a 400. Moving
        to the place it already has changes nothing. If-Match is the moved
        task's rev.
      x-zproject-scope: tasks:write
      x-zproject-destructive: false
      x-zproject-dry-run: true
      parameters:
        - $ref: '#/components/parameters/dryRun'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskMove'}
      responses:
        '200':
          description: The moved task, or a dry-run result with ?dryRun=true (op "move" for the task, "update" for renumbered siblings and summaries)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Task'
                  - $ref: '#/components/schemas/DryRunResult'
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/RevMismatch'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/tasks/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      operationId: restoreTask
      tags: [tasks]
      summary: Restore a deleted task and the subtree deleted with it (destructive)
      description: >-
        Undoes a task delete: the task and those of its descendants that the
        same delete tombstoned come back with their old parent and order;
        descendants deleted earlier stay deleted. Summaries are rolled up
        again. 409 conflict if the task is not deleted, its project or parent
        is deleted (restore the parent first), or its parent has become a
        milestone. The links deleted with the tasks come back too, when both
        their tasks are live again and the pair hasn't been linked since; a
        restore that would close a loop with links made since is a 409
        cycle. Destructive (SPEC.md §9.3): tokens with requireConfirm
        need the confirmId of a dry run. If-Match is the deleted task's rev.
        The body, if any, must be an empty object.
      x-zproject-scope: tasks:write
      x-zproject-destructive: true
      x-zproject-dry-run: true
      parameters:
        - $ref: '#/components/parameters/dryRun'
        - $ref: '#/components/parameters/ifMatch'
        - $ref: '#/components/parameters/confirm'
      responses:
        '200':
          description: The restored task, or a dry-run result with a confirmId (op "restore" for restored tasks, "update" for summaries)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Task'
                  - $ref: '#/components/schemas/DryRunResult'
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/RevMismatch'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/tasks/{id}/history:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      operationId: getTaskHistory
      tags: [tasks]
      summary: The change records of one task, oldest first
      x-zproject-scope: tasks:read
      x-zproject-destructive: false
      x-zproject-dry-run: false
      parameters:
        - $ref: '#/components/parameters/since'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Change records
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Change'}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/calendars:
    get:
      operationId: listCalendars
      tags: [calendars]
      summary: Every calendar, Standard first
      x-zproject-scope: resources:read
      x-zproject-destructive: false
      x-zproject-dry-run: false
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/includeDeleted'
      responses:
        '200':
          description: A page of calendars
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalendarPage'}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      operationId: createCalendar
      tags: [calendars]
      summary: Add a calendar
      description: >-
        Calendars are shared by every project, so writing one needs a token
        for all projects (403 forbidden_project otherwise). `base` must be a
        live calendar, with no loop of bases and at most 8 deep.
      x-zproject-scope: resources:write
      x-zproject-destructive: false
      x-zproject-dry-run: true
      parameters:
        - $ref: '#/components/parameters/dryRun'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CalendarInput'}
      responses:
        '200': {$ref: '#/components/responses/DryRun'}
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Calendar'}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/calendars/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      operationId: getCalendar
      tags: [calendars]
      summary: One calendar
      x-zproject-scope: resources:read
      x-zproject-destructive: false
      x-zproject-dry-run: false
      responses:
        '200':
          description: The calendar
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Calendar'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
    patch:
      operationId: updateCalendar
      tags: [calendars]
      summary: Change a calendar (If-Match honoured)
      description: Standard has no base. Needs a token for all projects.
      x-zproject-scope: resources:write
      x-zproject-destructive: false
      x-zproject-dry-run: true
      parameters:
        - $ref: '#/components/parameters/dryRun'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CalendarInput'}
      responses:
        '200':
          description: The updated calendar, or a dry-run result with ?dryRun=true
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Calendar'
                  - $ref: '#/components/schemas/DryRunResult'
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/RevMismatch'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      operationId: deleteCalendar
      tags: [calendars]
      summary: Tombstone a calendar and its exceptions (destructive)
      description: >-
        409 conflict with details.reason `standard` for Standard, or `in_use`
        with details.usedBy {projects, tasks, calendars} while a live project,
        task or calendar still uses it. Needs a token for all projects.
      x-zproject-scope: resources:write
      x-zproject-destructive: true
      x-zproject-dry-run: true
      parameters:
        - $ref: '#/components/parameters/dryRun'
        - $ref: '#/components/parameters/ifMatch'
        - $ref: '#/components/parameters/confirm'
      responses:
        '200':
          description: The tombstoned calendar, or a dry-run result with a confirmId
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Calendar'
                  - $ref: '#/components/schemas/DryRunResult'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/RevMismatch'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/calendars/{id}/exceptions:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      operationId: listCalendarExceptions
      tags: [calendars]
      summary: A calendar's own exceptions, by date
      x-zproject-scope: resources:read
      x-zproject-destructive: false
      x-zproject-dry-run: false
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/includeDeleted'
      responses:
        '200':
          description: A page of exceptions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalendarExceptionPage'}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      operationId: addCalendarException
      tags: [calendars]
      summary: Add a holiday, a non-working stretch or custom hours
      description: >-
        `holiday` and `non_working` take days out of the calendar;
        `custom_hours` changes the hours of days that are working anyway. One
        exception spans at most 366 days. Needs a token for all projects.
      x-zproject-scope: resources:write
      x-zproject-destructive: false
      x-zproject-dry-run: true
      parameters:
        - $ref: '#/components/parameters/dryRun'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CalendarExceptionInput'}
      responses:
        '200': {$ref: '#/components/responses/DryRun'}
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalendarException'}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/calendar-exceptions/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    delete:
      operationId: deleteCalendarException
      tags: [calendars]
      summary: Tombstone one exception (destructive)
      x-zproject-scope: resources:write
      x-zproject-destructive: true
      x-zproject-dry-run: true
      parameters:
        - $ref: '#/components/parameters/dryRun'
        - $ref: '#/components/parameters/ifMatch'
        - $ref: '#/components/parameters/confirm'
      responses:
        '200':
          description: The tombstoned exception, or a dry-run result with a confirmId
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CalendarException'
                  - $ref: '#/components/schemas/DryRunResult'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/RevMismatch'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/calendars/{id}/import-holidays:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      operationId: importHolidays
      tags: [calendars]
      summary: Add a year's public holidays (computed, not fetched)
      description: >-
        Adds the year's US federal holidays (observed dates, so New Year's Day
        of the next year can fall on 31 December) that the calendar doesn't
        already have as a holiday that day; each is its own exception. The
        body, if any, must be empty. Needs a token for all projects.
      x-zproject-scope: resources:write
      x-zproject-destructive: false
      x-zproject-dry-run: true
      parameters:
        - $ref: '#/components/parameters/dryRun'
        - name: country
          in: query
          required: true
          schema: {type: string, enum: [US]}
        - name: year
          in: query
          required: true
          schema: {type: integer, minimum: 1971, maximum: 9998}
      responses:
        '200':
          description: The exceptions added, or a dry-run result with ?dryRun=true
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/CalendarException'}
                  - $ref: '#/components/schemas/DryRunResult'
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/projects/{id}/schedule:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      operationId: getSchedule
      tags: [schedule]
      summary: The project's schedule, computed now
      description: >-
        Every task in outline order with early and late dates, total and free
        float (working days) and whether it is critical, plus the critical
        tasks, the project's forecast finish and the violations (reported,
        never fixed: no_start, manual_no_dates, link_broken, constraint_missed,
        deadline_missed, unknown_calendar). Auto tasks' and summaries' stored
        start and finish are these early dates.
      x-zproject-scope: schedule:read
      x-zproject-destructive: false
      x-zproject-dry-run: false
      responses:
        '200':
          description: The schedule
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/projects/{id}/critical-path:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      operationId: getCriticalPath
      tags: [schedule]
      summary: The critical tasks, by start
      x-zproject-scope: schedule:read
      x-zproject-destructive: false
      x-zproject-dry-run: false
      responses:
        '200':
          description: The critical path
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CriticalPath'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/projects/{id}/reschedule:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      operationId: rescheduleProject
      tags: [schedule]
      summary: Recompute now and store any stale dates
      description: >-
        Every write that can move dates already reschedules in the same
        transaction; this is for after a change outside the API. A no-op when
        nothing is stale. The body, if any, must be empty.
      x-zproject-scope: tasks:write
      x-zproject-destructive: false
      x-zproject-dry-run: true
      parameters:
        - $ref: '#/components/parameters/dryRun'
      responses:
        '200':
          description: How many tasks changed, or a dry-run result with ?dryRun=true
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [projectId, changed]
                    properties:
                      projectId: {$ref: '#/components/schemas/Id'}
                      changed: {type: integer, minimum: 0}
                  - $ref: '#/components/schemas/DryRunResult'
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/projects/{id}/dependencies:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      operationId: listDependencies
      tags: [dependencies]
      summary: A project's links, oldest first
      x-zproject-scope: tasks:read
      x-zproject-destructive: false
      x-zproject-dry-run: false
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/includeDeleted'
        - name: task
          in: query
          description: Only the links into or out of this task
          schema: {$ref: '#/components/schemas/Id'}
      responses:
        '200':
          description: A page of links
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DependencyPage'}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/dependencies:
    post:
      operationId: createDependency
      tags: [dependencies]
      summary: Link two tasks of one project
      description: >-
        Both tasks must be live and in the same project (400). A second live
        link between the same two tasks in the same direction is 409
        `conflict` with details.reason `duplicate` and details.existing. A
        link that would close a loop, through other links or through the
        task tree (a task and its own summary), is 409 `cycle` with
        details.path, the task ids around the loop. Links don't move any
        dates until the scheduling engine is live on the server (plan S5).
      x-zproject-scope: tasks:write
      x-zproject-destructive: false
      x-zproject-dry-run: true
      parameters:
        - $ref: '#/components/parameters/dryRun'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DependencyInput'}
      responses:
        '200': {$ref: '#/components/responses/DryRun'}
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dependency'}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/dependencies/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      operationId: getDependency
      tags: [dependencies]
      summary: One link
      x-zproject-scope: tasks:read
      x-zproject-destructive: false
      x-zproject-dry-run: false
      responses:
        '200':
          description: The link
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dependency'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
    patch:
      operationId: updateDependency
      tags: [dependencies]
      summary: Change a link's type or lag (If-Match honoured)
      description: >-
        Only `type` and `lag` change. A link's tasks are fixed: sending
        `predecessor`, `successor` or `project` is a 400; delete the link and
        add another instead.
      x-zproject-scope: tasks:write
      x-zproject-destructive: false
      x-zproject-dry-run: true
      parameters:
        - $ref: '#/components/parameters/dryRun'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DependencyUpdate'}
      responses:
        '200':
          description: The updated link, or a dry-run result with ?dryRun=true
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Dependency'
                  - $ref: '#/components/schemas/DryRunResult'
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/RevMismatch'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      operationId: deleteDependency
      tags: [dependencies]
      summary: Tombstone a link (destructive)
      x-zproject-scope: tasks:write
      x-zproject-destructive: true
      x-zproject-dry-run: true
      parameters:
        - $ref: '#/components/parameters/dryRun'
        - $ref: '#/components/parameters/ifMatch'
        - $ref: '#/components/parameters/confirm'
      responses:
        '200':
          description: The tombstoned link, or a dry-run result with a confirmId
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Dependency'
                  - $ref: '#/components/schemas/DryRunResult'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/RevMismatch'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/changes:
    get:
      operationId: listChanges
      tags: [sync]
      summary: The sync feed (needs projects:read too, and access to every project)
      x-zproject-scope: tasks:read
      x-zproject-destructive: false
      x-zproject-dry-run: false
      parameters:
        - $ref: '#/components/parameters/since'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Change records with seq > since
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChangePage'}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/tokens:
    get:
      operationId: listTokens
      tags: [admin]
      summary: Every token's metadata (never the secret or its hash)
      x-zproject-scope: admin
      x-zproject-destructive: false
      x-zproject-dry-run: false
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Token'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      operationId: createToken
      tags: [admin]
      summary: Create a device, app or agent token; the secret is returned once
      description: |
        Agent tokens: scopes default to `read` and can never include `admin`;
        they must name their projects (no `*`); they expire after 90 days by
        default and at most; `requireConfirm` defaults to true.
      x-zproject-scope: admin
      x-zproject-destructive: false
      x-zproject-dry-run: false
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenCreate'}
      responses:
        '201':
          description: Created; `token` is shown only in this response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenCreated'}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/tokens/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    delete:
      operationId: revokeToken
      tags: [admin]
      summary: Revoke a token; takes effect on its next request (destructive)
      x-zproject-scope: admin
      x-zproject-destructive: true
      x-zproject-dry-run: true
      parameters:
        - $ref: '#/components/parameters/dryRun'
        - $ref: '#/components/parameters/confirm'
      responses:
        '200':
          description: The revoked token, or a dry-run result with a confirmId
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Token'
                  - $ref: '#/components/schemas/DryRunResult'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/audit:
    get:
      operationId: listAudit
      tags: [admin]
      summary: The append-only, hash-chained audit log
      x-zproject-scope: audit:read
      x-zproject-destructive: false
      x-zproject-dry-run: false
      parameters:
        - $ref: '#/components/parameters/since'
        - $ref: '#/components/parameters/limit'
        - name: tokenId
          in: query
          schema: {$ref: '#/components/schemas/Id'}
      responses:
        '200':
          description: Audit rows with seq > since
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditPage'}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/admin/backup:
    post:
      operationId: runBackup
      tags: [admin]
      summary: Take a backup now (the same as the nightly timer)
      x-zproject-scope: admin
      x-zproject-destructive: false
      x-zproject-dry-run: false
      responses:
        '200':
          description: The files written and the ones pruned
          content:
            application/json:
              schema:
                type: object
                required: [databaseFile, exportFile, removed]
                properties:
                  databaseFile: {type: string}
                  exportFile: {type: string}
                  removed:
                    type: array
                    items: {type: string}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/Internal'}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "zpt_<id>.<secret> scoped token (SPEC.md §9.2)"
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 500, default: 100}
    cursor:
      name: cursor
      in: query
      description: nextCursor from the previous page
      schema: {type: string}
    since:
      name: since
      in: query
      description: Return rows with seq greater than this
      schema: {type: integer, minimum: 0, default: 0}
    includeDeleted:
      name: includeDeleted
      in: query
      schema: {type: boolean, default: false}
    dryRun:
      name: dryRun
      in: query
      description: Validate and describe the change without making it
      schema: {type: boolean, default: false}
    ifMatch:
      name: If-Match
      in: header
      description: The rev the change is based on; 412 if it moved on
      schema: {type: string}
    confirm:
      name: X-Zproject-Confirm
      in: header
      description: confirmId from a dry run of the identical request (single use, 5 minutes)
      schema: {type: string}
  responses:
    DryRun:
      description: Dry-run result (?dryRun=true)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DryRunResult'}
    Validation:
      description: "400 validation: the request is malformed or a field is invalid"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthenticated:
      description: "401 unauthenticated: missing, unknown, expired or revoked token"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: "403 forbidden_scope or forbidden_project"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: "404 not_found"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: "409 conflict, cycle or confirm_required"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RevMismatch:
      description: "412 rev_mismatch: If-Match did not match the current rev"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnsupportedMediaType:
      description: "415 unsupported_media_type: writes must be application/json"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: "429 rate_limited; see Retry-After"
      headers:
        Retry-After:
          description: Seconds to wait
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Internal:
      description: "500 internal (no details)"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Id:
      type: string
      pattern: '^[0-9a-f]{20}$'
    Date:
      type: [string, 'null']
      pattern: '^\d{4}-\d{2}-\d{2}$'
    Timestamp:
      type: string
      description: UTC ISO 8601 with milliseconds
    Error:
      type: object
      required: [error, code]
      properties:
        error: {type: string}
        code: {type: string}
        details: {type: object}
    Health:
      type: object
      additionalProperties: false
      required: [ok, version, apiVersion, schemaVersion]
      properties:
        ok: {type: boolean}
        version: {type: string, description: App version (x.y.z)}
        apiVersion: {type: integer, const: 1}
        schemaVersion: {type: integer, minimum: 0}
    EntityBase:
      type: object
      required: [id, createdAt, updatedAt, deleted, rev]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
        deleted: {type: boolean}
        rev: {type: integer, minimum: 1}
    ProjectInput:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1}
        description: {type: string}
        objectives: {type: string}
        scope: {type: string}
        outOfScope: {type: string}
        successCriteria: {type: string}
        owner: {type: string}
        sponsor: {type: string}
        status: {type: string, enum: [active, on_hold, done, cancelled]}
        rag: {type: string, enum: [green, amber, red]}
        priority: {type: integer, minimum: 1, maximum: 4}
        start: {$ref: '#/components/schemas/Date'}
        finish: {$ref: '#/components/schemas/Date'}
        budget: {type: [number, 'null'], minimum: 0}
        color: {type: [string, 'null']}
        order: {type: integer}
        calendar:
          type: [string, 'null']
          pattern: '^[0-9a-f]{20}$'
          description: A live calendar's id; null = Standard
    Project:
      allOf:
        - $ref: '#/components/schemas/EntityBase'
        - $ref: '#/components/schemas/ProjectInput'
        - required: [name, status, rag, priority]
    TaskStatus:
      type: string
      enum: [todo, in_progress, done]
    TaskInput:
      type: object
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1}
        parent: {type: [string, 'null'], pattern: '^[0-9a-f]{20}$'}
        notes: {type: string}
        type: {type: string, enum: [task, milestone]}
        mode: {type: string, enum: [auto, manual]}
        duration: {type: number, minimum: 0}
        start:
          allOf: [{$ref: '#/components/schemas/Date'}]
          description: >-
            Set only on manual tasks. An auto task's and a summary's start and
            finish come from the schedule (400 if set by hand: use an SNET
            constraint, or make the task manual).
        finish: {$ref: '#/components/schemas/Date'}
        constraint: {type: string, enum: [ASAP, SNET, FNLT]}
        constraintDate: {$ref: '#/components/schemas/Date'}
        deadline: {$ref: '#/components/schemas/Date'}
        calendar:
          type: [string, 'null']
          pattern: '^[0-9a-f]{20}$'
          description: A live calendar's id; null = the project's
        percentComplete:
          type: integer
          minimum: 0
          maximum: 100
          description: Derived (duration-weighted over leaf tasks) on a summary task.
        actualStart: {$ref: '#/components/schemas/Date'}
        actualFinish: {$ref: '#/components/schemas/Date'}
        status: {$ref: '#/components/schemas/TaskStatus'}
        priority: {type: integer, minimum: 1, maximum: 4}
        fixedCost: {type: number, minimum: 0}
    Task:
      allOf:
        - $ref: '#/components/schemas/EntityBase'
        - $ref: '#/components/schemas/TaskInput'
        - type: object
          required: [project, title, type, duration, status]
          properties:
            project: {$ref: '#/components/schemas/Id'}
            order:
              type: integer
              minimum: 1
              readOnly: true
              description: >-
                Position among the parent's children (1 = first; gaps are allowed). Read-only:
                a create or PATCH body with `order` is a 400 validation error; reorder with
                POST /v1/tasks/{id}/move.
    TaskMove:
      type: object
      additionalProperties: false
      properties:
        parent:
          type: [string, 'null']
          pattern: '^[0-9a-f]{20}$'
          description: The new parent task (null = top level); omitted, the parent stays
        position:
          type: integer
          minimum: 0
          description: 0-based index among the new parent's live children, not counting the task; omitted = last
    WorkDay:
      type: object
      additionalProperties: false
      required: [working, hours]
      properties:
        working: {type: boolean}
        hours: {type: number, minimum: 0, maximum: 24, description: 'More than 0 on a working day; 0 otherwise'}
    CalendarInput:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1}
        base:
          type: [string, 'null']
          pattern: '^[0-9a-f]{20}$'
          description: The calendar this one inherits from (its work week, if this has none, and its exceptions)
        workWeek:
          type: [array, 'null']
          minItems: 7
          maxItems: 7
          items: {$ref: '#/components/schemas/WorkDay'}
          description: Monday first, with at least one working day; null = the base's (at the root, Monday–Friday 8 h)
        hoursPerDay: {type: number, exclusiveMinimum: 0, maximum: 24}
    Calendar:
      allOf:
        - $ref: '#/components/schemas/EntityBase'
        - $ref: '#/components/schemas/CalendarInput'
        - required: [name, base, workWeek, hoursPerDay]
    CalendarExceptionInput:
      type: object
      additionalProperties: false
      required: [from]
      properties:
        from: {$ref: '#/components/schemas/Date'}
        to:
          allOf: [{$ref: '#/components/schemas/Date'}]
          description: Defaults to `from`
        kind: {type: string, enum: [holiday, non_working, custom_hours]}
        hours: {type: number, minimum: 0, maximum: 24, description: custom_hours only}
        label: {type: string, maxLength: 200}
    CalendarException:
      allOf:
        - $ref: '#/components/schemas/EntityBase'
        - $ref: '#/components/schemas/CalendarExceptionInput'
        - type: object
          required: [calendar, from, to, kind, hours, label]
          properties:
            calendar: {$ref: '#/components/schemas/Id'}
    CalendarPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Calendar'}
        nextCursor: {type: [string, 'null']}
    CalendarExceptionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CalendarException'}
        nextCursor: {type: [string, 'null']}
    ScheduleViolation:
      type: object
      required: [project, kind, task, other, message]
      properties:
        project: {$ref: '#/components/schemas/Id'}
        kind:
          type: string
          enum: [no_start, manual_no_dates, link_broken, constraint_missed, deadline_missed, unknown_calendar]
        task: {type: [string, 'null']}
        other: {type: [string, 'null'], description: 'link_broken: the predecessor; unknown_calendar: the calendar'}
        message: {type: string}
    ScheduledTask:
      type: object
      required: [id, scheduled, summary, milestone, fixed, start, finish, lateStart, lateFinish, totalFloat, freeFloat, critical]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        scheduled: {type: boolean, description: 'false: no dates (e.g. no project start and nothing else anchoring it)'}
        summary: {type: boolean}
        milestone: {type: boolean}
        fixed: {type: boolean, description: 'manual, or done (an actual finish): never moved'}
        start: {type: [string, 'null'], format: date}
        finish: {type: [string, 'null'], format: date}
        lateStart: {type: [string, 'null'], format: date}
        lateFinish: {type: [string, 'null'], format: date}
        totalFloat: {type: integer, description: Working days of the task's calendar}
        freeFloat: {type: integer}
        critical: {type: boolean, description: 'Total float <= 0 and not done'}
    Schedule:
      type: object
      required: [projectId, finish, critical, violations, tasks]
      properties:
        projectId: {$ref: '#/components/schemas/Id'}
        finish: {type: [string, 'null'], format: date, description: The latest scheduled finish}
        critical:
          type: array
          items: {$ref: '#/components/schemas/Id'}
        violations:
          type: array
          items: {$ref: '#/components/schemas/ScheduleViolation'}
        tasks:
          type: array
          items: {$ref: '#/components/schemas/ScheduledTask'}
    CriticalPath:
      type: object
      required: [projectId, finish, tasks]
      properties:
        projectId: {$ref: '#/components/schemas/Id'}
        finish: {type: [string, 'null'], format: date}
        tasks:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ScheduledTask'
              - type: object
                required: [title]
                properties:
                  title: {type: string}
    LinkType:
      type: string
      enum: [FS, SS, FF]
      description: >-
        FS: the successor starts after the predecessor finishes; SS: it starts
        no earlier than the predecessor starts; FF: it finishes no earlier
        than the predecessor finishes.
    Lag:
      type: integer
      minimum: -3650
      maximum: 3650
      description: Whole working days of the successor's calendar; negative is a lead
    DependencyInput:
      type: object
      additionalProperties: false
      required: [predecessor, successor]
      properties:
        predecessor: {$ref: '#/components/schemas/Id'}
        successor: {$ref: '#/components/schemas/Id'}
        type: {$ref: '#/components/schemas/LinkType'}
        lag: {$ref: '#/components/schemas/Lag'}
        project:
          allOf: [{$ref: '#/components/schemas/Id'}]
          description: Optional; must be the tasks' project
    DependencyUpdate:
      type: object
      additionalProperties: false
      properties:
        type: {$ref: '#/components/schemas/LinkType'}
        lag: {$ref: '#/components/schemas/Lag'}
    Dependency:
      allOf:
        - $ref: '#/components/schemas/EntityBase'
        - type: object
          required: [project, predecessor, successor, type, lag]
          properties:
            project: {$ref: '#/components/schemas/Id'}
            predecessor: {$ref: '#/components/schemas/Id'}
            successor: {$ref: '#/components/schemas/Id'}
            type: {$ref: '#/components/schemas/LinkType'}
            lag: {$ref: '#/components/schemas/Lag'}
    DependencyPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Dependency'}
        nextCursor: {type: [string, 'null']}
    ProjectPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Project'}
        nextCursor: {type: [string, 'null']}
    TaskPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Task'}
        nextCursor: {type: [string, 'null']}
    Wbs:
      type: object
      required: [projectId, items]
      properties:
        projectId: {$ref: '#/components/schemas/Id'}
        items:
          type: array
          items:
            type: object
            required: [id, wbs, depth, title, type, parent]
            properties:
              id: {$ref: '#/components/schemas/Id'}
              wbs: {type: string, examples: ['1.2.3']}
              depth: {type: integer, minimum: 0}
              title: {type: string}
              type: {type: string, enum: [task, milestone]}
              parent: {type: [string, 'null']}
    DryRunResult:
      type: object
      required: [dryRun, changes, ripple]
      properties:
        dryRun: {type: boolean, const: true}
        changes:
          type: array
          items:
            type: object
            required: [op, entityKind, entityId, before, after]
            properties:
              op: {type: string, enum: [create, update, delete, revoke, move, restore]}
              entityKind: {type: string}
              entityId: {type: [string, 'null']}
              before: {type: object}
              after: {type: object}
        ripple:
          type: object
          description: >-
            What the write would do to the schedule, computed by doing it and
            undoing it: the tasks whose dates move (deltas in calendar days),
            the largest change in a project's finish, whether the critical set
            changes, and the violations afterwards. Empty for writes that
            can't move dates.
          required: [moved, finishDelta, criticalChanged, violations]
          properties:
            moved:
              type: array
              items:
                type: object
                required: [project, task, startBefore, startAfter, finishBefore, finishAfter, startDelta, finishDelta]
                properties:
                  project: {$ref: '#/components/schemas/Id'}
                  task: {$ref: '#/components/schemas/Id'}
                  startBefore: {type: [string, 'null'], format: date}
                  startAfter: {type: [string, 'null'], format: date}
                  finishBefore: {type: [string, 'null'], format: date}
                  finishAfter: {type: [string, 'null'], format: date}
                  startDelta: {type: integer}
                  finishDelta: {type: integer}
            finishDelta: {type: integer}
            criticalChanged: {type: boolean}
            violations:
              type: array
              items: {$ref: '#/components/schemas/ScheduleViolation'}
        confirmId:
          type: string
          description: For destructive operations; send it in X-Zproject-Confirm
        confirmExpiresAt: {$ref: '#/components/schemas/Timestamp'}
    Change:
      type: object
      required: [seq, ts, actor, entityKind, entityId, before, after]
      properties:
        seq: {type: integer}
        ts: {$ref: '#/components/schemas/Timestamp'}
        actor: {type: string, description: Token id or "system"}
        entityKind: {type: string}
        entityId: {type: string}
        before: {type: object}
        after: {type: object}
        requestId: {type: [string, 'null']}
    ChangePage:
      type: object
      required: [items, nextSince, more]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Change'}
        nextSince: {type: integer}
        more: {type: boolean}
    Scope:
      type: string
      enum: [projects:read, tasks:read, schedule:read, resources:read, raid:read, reports:read,
             calendar:read, alerts:read, projects:write, tasks:write, resources:write, baselines:write,
             raid:write, templates:write, alerts:write, audit:read, admin, read, write]
    Token:
      type: object
      required: [id, name, kind, scopes, projects, createdAt, requireConfirm, active]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string}
        kind: {type: string, enum: [owner, device, app, agent]}
        scopes:
          type: array
          items: {$ref: '#/components/schemas/Scope'}
        projects:
          type: array
          items: {type: string}
          description: Project ids, or ["*"] for all
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        createdBy: {type: [string, 'null']}
        expiresAt: {type: [string, 'null']}
        lastUsedAt: {type: [string, 'null']}
        revokedAt: {type: [string, 'null']}
        requireConfirm: {type: boolean}
        rateLimit: {type: [object, 'null']}
        active: {type: boolean}
    TokenCreate:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        kind: {type: string, enum: [device, app, agent]}
        scopes:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Scope'}
        projects:
          type: array
          minItems: 1
          items: {type: string}
        expiresInDays: {type: [integer, 'null'], minimum: 1, maximum: 3650}
        requireConfirm: {type: boolean}
        rateLimit:
          type: [object, 'null']
          additionalProperties: false
          properties:
            read: {type: integer, minimum: 1}
            write: {type: integer, minimum: 1}
            destructive: {type: integer, minimum: 1}
            total: {type: integer, minimum: 1}
    TokenCreated:
      allOf:
        - $ref: '#/components/schemas/Token'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: zpt_<id>.<secret>, shown once; store it in a keychain
    AuditEntry:
      type: object
      required: [seq, ts, status, prevHash, hash]
      properties:
        seq: {type: integer}
        ts: {$ref: '#/components/schemas/Timestamp'}
        tokenId: {type: [string, 'null']}
        tokenName: {type: [string, 'null']}
        tokenKind: {type: [string, 'null']}
        tsUser: {type: [string, 'null']}
        tsNode: {type: [string, 'null']}
        method: {type: [string, 'null']}
        path: {type: [string, 'null']}
        mcpTool: {type: [string, 'null']}
        entityKind: {type: [string, 'null']}
        entityId: {type: [string, 'null']}
        before: {type: [object, 'null']}
        after: {type: [object, 'null']}
        dryRun: {type: boolean}
        confirmId: {type: [string, 'null']}
        status: {type: integer}
        requestId: {type: [string, 'null']}
        prevHash: {type: string}
        hash: {type: string}
    AuditPage:
      type: object
      required: [items, nextSince, more]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AuditEntry'}
        nextSince: {type: integer}
        more: {type: boolean}
