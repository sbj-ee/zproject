<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>zproject concept B: Gantt grid behind Z</title>
  <!-- zproject icon concept. Zorro Z path copied verbatim from sbj-ee/zmail assets/icons/src/zmail.svg
       (vector of the zterminal family mark); tile geometry and green palette from the same file.
       Accent: Gantt blue #2fa8f0 (#7fd8ff -> #1668c9). -->
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37383d"/><stop offset="1" stop-color="#2a2b2f"/>
    </linearGradient>
    <linearGradient id="zfill" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#28502a"/><stop offset="0.45" stop-color="#28502a"/><stop offset="1" stop-color="#53833e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd8ff"/><stop offset="0.5" stop-color="#2fa8f0"/><stop offset="1" stop-color="#1668c9"/>
    </linearGradient>
    <linearGradient id="dia" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfeaff"/><stop offset="1" stop-color="#2fa8f0"/>
    </linearGradient>
    <filter id="glowWide" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="glowNear" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="barGlow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="14"/></filter>
    <path id="z" d="M 250 450
                    C 390 356 590 304 802 270
                    C 690 410 560 560 440 676
                    C 580 658 700 628 808 578
                    C 680 676 470 746 222 822
                    C 360 670 500 520 640 372
                    C 520 366 360 390 250 450 Z"/>
    <clipPath id="zClip"><use href="#z"/></clipPath>
    <clipPath id="tileClip"><rect x="104" y="108" width="816" height="816" rx="136"/></clipPath>
  </defs>
  <rect x="68" y="72" width="888" height="888" rx="170" fill="url(#frame)"/>
  <rect x="70" y="74" width="884" height="884" rx="168" fill="none" stroke="#37383d" stroke-width="4"/>
  <rect x="104" y="108" width="816" height="816" rx="136" fill="#0a0e11"/>
  <g clip-path="url(#tileClip)" stroke="#2fa8f0" stroke-opacity="0.13" stroke-width="3"><line x1="206" y1="108" x2="206" y2="924"/><line x1="308" y1="108" x2="308" y2="924"/><line x1="410" y1="108" x2="410" y2="924"/><line x1="512" y1="108" x2="512" y2="924"/><line x1="614" y1="108" x2="614" y2="924"/><line x1="716" y1="108" x2="716" y2="924"/><line x1="818" y1="108" x2="818" y2="924"/><line x1="104" y1="300" x2="920" y2="300" stroke-opacity="0.07"/><line x1="104" y1="516" x2="920" y2="516" stroke-opacity="0.07"/><line x1="104" y1="732" x2="920" y2="732" stroke-opacity="0.07"/></g>
  <rect x="160" y="220" width="330" height="52" rx="26.0" fill="#2fa8f0" opacity="0.55" filter="url(#barGlow)"/>
  <rect x="160" y="220" width="330" height="52" rx="26.0" fill="url(#bar)" opacity="1.0"/>
  <rect x="175.6" y="229.36" width="298.8" height="8.32" rx="4.16" fill="#e6f7ff" opacity="0.55"/>
  <rect x="360" y="486" width="330" height="52" rx="26.0" fill="#2fa8f0" opacity="0.55" filter="url(#barGlow)"/>
  <rect x="360" y="486" width="330" height="52" rx="26.0" fill="url(#bar)" opacity="1.0"/>
  <rect x="375.6" y="495.36" width="298.8" height="8.32" rx="4.16" fill="#e6f7ff" opacity="0.55"/>
  <rect x="560" y="752" width="300" height="52" rx="26.0" fill="#2fa8f0" opacity="0.55" filter="url(#barGlow)"/>
  <rect x="560" y="752" width="300" height="52" rx="26.0" fill="url(#bar)" opacity="1.0"/>
  <rect x="575.6" y="761.36" width="268.8" height="8.32" rx="4.16" fill="#e6f7ff" opacity="0.55"/>
  <g clip-path="url(#tileClip)">
    <use href="#z" fill="#003600" filter="url(#glowWide)" transform="translate(0 8)"/>
    <use href="#z" fill="#53833e" filter="url(#glowWide)" opacity="0.7"/>
    <use href="#z" fill="#82e164" filter="url(#glowNear)" opacity="0.9"/>
  </g>
  <use href="#z" fill="#0a0e11" stroke="#0a0e11" stroke-width="26" stroke-linejoin="round"/>
  <use href="#z" fill="url(#zfill)"/>
  <g clip-path="url(#zClip)"><use href="#z" fill="none" stroke="#82e164" stroke-width="30" filter="url(#edge)" opacity="0.9"/></g>
  <use href="#z" fill="none" stroke="#82e164" stroke-width="7" stroke-linejoin="miter" stroke-miterlimit="20"/>
  <use href="#z" fill="none" stroke="#cefcb9" stroke-width="2.5" stroke-linejoin="miter" stroke-miterlimit="20"/>
  <path d="M 330 404 C 470 340 640 302 784 280" stroke="#e7ffd5" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.75"/>
  <path d="M 300 790 C 500 736 680 670 790 596" stroke="#cefcb9" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
